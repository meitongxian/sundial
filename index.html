<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sundial</title>
    <link rel="stylesheet" type="text/css" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fragment+Mono:ital@0;1&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div class="center base-markings">
      <p class="mono marker" id="midnight">12AM</p>
      <p class="mono marker" id="noon">12PM</p>
      <p class="mono marker" id="sunrise">6AM</p>
      <p class="mono marker" id="sunset">6PM</p>
    </div>
    <div class="hand"></div>
    <script src="script.js"></script>
  </body>
</html>
